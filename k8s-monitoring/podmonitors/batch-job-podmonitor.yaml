apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: batch-job-podmonitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      job-type: data-sync
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - port: metrics
      interval: 10s
